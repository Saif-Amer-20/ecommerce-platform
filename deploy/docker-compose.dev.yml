version: '3.8'
services:
  api:
    build:
      context: ../src/WebApi
      dockerfile: ../../deploy/Dockerfile.api
    depends_on:
      - db
      - redis
      - minio
      - meili
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DB__CONN: Host=db;Port=5432;Database=ecommerce;Username=postgres;Password=postgres
      REDIS__CONN: redis:6379
      MINIO__ENDPOINT: http://minio:9000
      MINIO__KEY: minioadmin
      MINIO__SECRET: minioadmin
      MEILI__HOST: http://meili:7700
      JWT_SECRET: devsecret
    ports:
      - "8080:80"
    volumes:
      - ../src:/app/src:ro
  storefront:
    build:
      context: ../apps/storefront
      dockerfile: ../../deploy/Dockerfile.frontend
      args:
        NEXT_APP: storefront
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ../apps/storefront:/usr/src/app
  admin:
    build:
      context: ../apps/admin
      dockerfile: ../../deploy/Dockerfile.frontend
      args:
        NEXT_APP: admin
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8080/api/v1
    ports:
      - "3100:3000"
    volumes:
      - ../apps/admin:/usr/src/app
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
  meili:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: masterKey
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
volumes:
  postgres-data:
  redis-data:
  minio-data:
  meili-data: