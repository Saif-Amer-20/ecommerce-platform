name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - name: Restore and Build API
        run: |
          cd ecommerce/src/WebApi
          dotnet restore
          dotnet build --configuration Release
      - name: Run Backend Tests
        run: |
          dotnet test ecommerce/src/WebApi --configuration Release --no-build || true
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
      - name: Install dependencies and run frontend unit tests
        run: |
          cd ecommerce
          npm ci
          # تشغيل اختبارات Vitest إن وجدت
          npm test --workspaces || true
      - name: Build Docker images
        run: |
          docker build -f ecommerce/deploy/Dockerfile.api -t ecommerce-api .
          docker build -f ecommerce/deploy/Dockerfile.frontend --build-arg NEXT_APP=storefront -t ecommerce-storefront .
          docker build -f ecommerce/deploy/Dockerfile.frontend --build-arg NEXT_APP=admin -t ecommerce-admin .
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: api
          path: ecommerce/src/WebApi/bin/Release